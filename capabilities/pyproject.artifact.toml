# Template used by the pipeline to build any capability artifact.
# Only that capability's own Python package ships; platform code never does.
[project]
name = "@DIST@"
version = "@VERSION@"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2,<2", "httpx"]

[project.scripts]
@DIST@-stdio = "@PKG@.stdio_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/@PKG@"]
