# Capability pipeline: PR = check only, merge = publish to registry, then deploy + catalogue.
# NOT YET RUN: this repo is not on GitHub. Registry here is a `registry` branch (demo stand-in
# for Artifactory / GitHub Packages / a container registry).
name: capability-release
on:
  pull_request:
  push:
    branches: [main]
    paths: ["capabilities/**", "src/**", "pyproject.toml", ".github/workflows/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # 1. PR: run every check, publish nothing. Result shows on the PR for reviewers.
  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Fetch registry (read-only, for the version-bump check)
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" registry >/dev/null; then
            git clone --branch registry "$URL" .gmo/registry
          else
            mkdir -p .gmo/registry && git -C .gmo/registry init -b registry
          fi
      - run: uv run gmo --ws .gmo release --dry-run --only-new
        env:
          GMO_PR: "${{ github.repository }}#${{ github.event.number }}"

  # 2. Merge to main: rebuild from the merged commit and write the signed release.
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production          # protected environment: optional extra approval click
    concurrency: registry-write      # one registry writer at a time
    permissions:
      contents: write                # push to the registry branch
    outputs:
      released: ${{ steps.rel.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Fetch registry
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" registry >/dev/null; then
            git clone --branch registry "$URL" .gmo/registry
          else
            mkdir -p .gmo/registry && git -C .gmo/registry init -b registry
          fi
      - name: Require a real signing key
        env:
          GMO_SIGNING_KEY: ${{ secrets.GMO_SIGNING_KEY }}
        run: test "${#GMO_SIGNING_KEY}" -ge 32 || { echo "::error::GMO_SIGNING_KEY secret missing or too short"; exit 1; }
      - id: rel
        run: |
          uv run gmo --ws .gmo release --only-new | tee out.txt
          echo "released=$(grep -c '^approved' out.txt)" >> "$GITHUB_OUTPUT"
        env:
          GMO_SIGNING_KEY: ${{ secrets.GMO_SIGNING_KEY }}   # only this job can sign
          GMO_PR: ${{ github.sha }}
      - name: Verify every release in the registry (signature + artifact digest)
        env:
          GMO_SIGNING_KEY: ${{ secrets.GMO_SIGNING_KEY }}
        run: uv run gmo --ws .gmo verify
      - name: Push new releases (append only)
        if: steps.rel.outputs.released != '0'
        working-directory: .gmo/registry
        run: |
          git config user.name "gmo-release-bot" && git config user.email "gmo-release-bot@users.noreply.github.com"
          git add -A && git commit -m "release from ${{ github.sha }}"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:registry

  # 3. Deploy the approved release to AWS and publish the catalogue. A separate job, so a failed
  #    deploy never leaves the registry half-written. No stored AWS keys: OIDC role, gmo-* only.
  deploy:
    needs: release
    if: needs.release.outputs.released != '0'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write      # request the OIDC token for AWS
      contents: write      # push the catalogue branch
    env:
      GMO_SIGNING_KEY: ${{ secrets.GMO_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra aws
      - name: Fetch registry
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone --branch registry "$URL" .gmo/registry
      - name: Verify registry (signature + artifact digest)
        run: uv run gmo --ws .gmo verify
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gmo-github-deploy
          aws-region: us-east-1
      - name: Entra settings (identifiers, not secrets)
        run: |
          python3 - <<'PY'
          import json, os
          json.dump({"tenant_id": os.environ["T"], "api_client_id": os.environ["C"], "api_audience": "api://" + os.environ["C"],
                     "scope": f"api://{os.environ['C']}/project-status:read", "codex_client_id": os.environ["X"],
                     "issuer": f"https://login.microsoftonline.com/{os.environ['T']}/v2.0"}, open(".gmo/entra.json", "w"))
          PY
        env:
          T: ${{ vars.ENTRA_TENANT_ID }}
          C: ${{ vars.ENTRA_API_CLIENT_ID }}
          X: ${{ vars.ENTRA_CODEX_CLIENT_ID }}
      - name: Deploy latest approved project-status to AWS, then run the live checks
        run: |
          uv run python platforms/aws/deploy.py --registry .gmo/registry --cap ahead.project-status \
            --version latest --entra .gmo/entra.json --ci --work .gmo/aws-work \
            --state-out .gmo/deployments/aws-ahead.project-status.json
      - name: Build the remote catalogue (feed + OpenAI-workspace marketplace)
        run: uv run gmo --ws .gmo catalogue --remote-only
      - name: Publish the catalogue branch
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          rm -rf cat && mkdir cat && cp -r .gmo/catalogue/. cat/ && cd cat
          git init -q -b catalogue && git config user.name "gmo-release-bot" && git config user.email "gmo-release-bot@users.noreply.github.com"
          git add -A && git commit -q -m "catalogue from ${{ github.sha }}"
          git push -f "$URL" HEAD:catalogue
